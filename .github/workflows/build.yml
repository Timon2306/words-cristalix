name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri:build

      - name: Prepare EXEs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-files | Out-Null
          Copy-Item "src-tauri/target/release/mc-words-overlay.exe" "release-files/MC-Words-Overlay-Portable-x64.exe"

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "release-files/MC-Words-Overlay-Setup-x64.exe"

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: MC-Words-Overlay-Portable-x64
          path: release-files/MC-Words-Overlay-Portable-x64.exe
          retention-days: 14

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: MC-Words-Overlay-Setup-x64
          path: release-files/MC-Words-Overlay-Setup-x64.exe
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/MC-Words-Overlay-Portable-x64.exe
            release-files/MC-Words-Overlay-Setup-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
